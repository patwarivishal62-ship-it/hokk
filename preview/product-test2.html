<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product gallery test — v3.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">

<style>
/* simulated stale Custom CSS pasted by user */
.product { --pp-gold: #B98A4E; --pp-frame: #EFE5D2; --pp-pill: 999px; }
.product__media { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.2vw, 14px); }
.product__media-item { background: #EFE5D2; overflow: hidden; flex: 1 1 0; min-width: 0; box-shadow: 0 1px 2px rgba(33,25,18,.05); }
.product__media-item:first-child { flex: 1 0 100%; }
.product__media-item:not(:first-child) .product__media-img { aspect-ratio: 1 / 1; }
</style>
</head>
<body>
<main id="MainContent">
<section class="product section-product">
  <div class="container">
    <div class="product__grid">
      <div class="product__media" data-product-gallery>
        <div class="product__media-feature">
          <div class="product__media-item is-active" data-feature-item data-media-id="1">
            <img class="product__media-img" src="images/hero.jpg" alt="test 1" loading="eager">
          </div>
          <div class="product__media-item" data-feature-item data-media-id="2">
            <img class="product__media-img" src="images/lookbook-1.jpg" alt="test 2" loading="eager">
          </div>
          <div class="product__media-item" data-feature-item data-media-id="3">
            <img class="product__media-img" src="images/lookbook-2.jpg" alt="test 3" loading="eager">
          </div>
          <div class="product__media-item" data-feature-item data-media-id="4">
            <img class="product__media-img" src="images/craft-loom.jpg" alt="test 4" loading="eager">
          </div>
        </div>
        <div class="product__thumbs">
          <button type="button" class="product__thumb is-active" data-thumb data-media-id="1" aria-current="true"> <img class="product__thumb-img" src="images/hero.jpg" alt="t1" loading="lazy"></button>
          <button type="button" class="product__thumb" data-thumb data-media-id="2"> <img class="product__thumb-img" src="images/lookbook-1.jpg" alt="t2" loading="lazy"></button>
          <button type="button" class="product__thumb" data-thumb data-media-id="3"> <img class="product__thumb-img" src="images/lookbook-2.jpg" alt="t3" loading="lazy"></button>
          <button type="button" class="product__thumb" data-thumb data-media-id="4"> <img class="product__thumb-img" src="images/craft-loom.jpg" alt="t4" loading="lazy"></button>
        </div>
      </div>
      <div class="product__info">
        <p class="product__vendor">House of Kala Katha</p>
        <h1 class="product__title">Pochampally Ikat Shirt</h1>
        <div class="product__price"><div class="price"><span class="price__current">₹2,800.00</span></div><span class="product__save">Save ₹700</span></div>
        <form class="product-form">
          <div class="product-form__actions">
            <button type="submit" class="btn btn--solid product-form__add">Add to bag</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
</main>
<script src="theme.js" defer></script>
</body>
</html>
